# Firefox mach try OS Integration Testing Presets
# These presets define standardized configurations for running OS integration tests
# via the Firefox mach try system

presets:
  win11-24h2:
    description: "Windows 11 24H2 standard testing"
    query: "-xq 'test-windows11-64'"
    flags:
      - "--all-tasks"
      - "--no-artifact"
    worker_overrides:
      - win11-64-24h2=gecko-t/win11-64-24h2-alpha
      - win11-64-24h2-gpu=gecko-t/win11-64-24h2-gpu-alpha
      - win11-64-24h2-source=gecko-t/win11-64-24h2-source-alpha
      - win11-64-24h2-large=gecko-t/win11-64-24h2-large-alpha
      - win11-64-24h2-webgpu=gecko-t/win11-64-24h2-webgpu-alpha
    use_os_integration: true
    query_sets:
      targeted:
        description: "Specific test suites for fast alpha validation"
        use_existing_tasks: true
        skip_os_integration: true
        watch_filter: "test-windows11-64-24h2-asan/opt-mochitest-(browser-chrome|chrome-1proc|devtools-chrome)|test-windows11-64-24h2(-devedition)?/(opt|debug)-xpcshell"
        queries:
          - "test-windows11-64-24h2-asan/opt-mochitest-browser-chrome"
          - "test-windows11-64-24h2-asan/opt-mochitest-chrome-1proc"
          - "test-windows11-64-24h2-asan/opt-mochitest-devtools-chrome"
          - "test-windows11-64-24h2/debug-xpcshell"
          - "test-windows11-64-24h2/opt-xpcshell"
          - "test-windows11-64-24h2-devedition/opt-xpcshell"

  win11-25h2-gpu-webgpu:
    description: "Windows 11 25H2 GPU and WebGPU testing"
    worker_types:
      - win11-64-24h2-gpu
      - win11-64-24h2-webgpu
    flags:
      - "--all-tasks"
      - "--no-artifact"
    worker_overrides:
      - win11-64-24h2-gpu=gecko-t/win11-64-25h2-gpu
      - win11-64-24h2-webgpu=gecko-t/win11-64-25h2-webgpu
    use_os_integration: false

  win11-25h2:
    description: "Windows 11 25H2 testing (redirects 24H2 tasks to 25H2 alpha pools)"
    query: "-xq 'test-windows11-64'"
    flags:
      - "--all-tasks"
      - "--no-artifact"
    worker_overrides:
      - win11-64-24h2=gecko-t/win11-64-25h2-alpha
      - win11-64-24h2-gpu=gecko-t/win11-64-25h2-gpu-alpha
      - win11-64-24h2-source=gecko-t/win11-64-25h2-source-alpha
      - win11-64-24h2-large=gecko-t/win11-64-25h2-large-alpha
      - win11-64-24h2-webgpu=gecko-t/win11-64-25h2-webgpu-alpha
    use_os_integration: true

  win11-25h2-prod:
    description: "Windows 11 25H2 tier 1 on production pool (post-deploy image validation)"
    query: '-q "''test-windows11-64-25h2"'
    flags:
      - "--no-artifact"
    worker_overrides: []
    use_os_integration: false
    query_sets:
      full-cloud:
        description: "All cloud Windows 24H2+25H2 tests (hardware excluded) — full shared-base-image validation"
        use_existing_tasks: true
        skip_os_integration: true
        watch_filter: "test-windows11-(64|32)-(24h2|25h2)|test-windows10-64-2009-qr"
        queries:
          - "'test-windows11-64-25h2"
          - "'test-windows11-32-25h2"
          - "'test-windows11-64-24h2 !browsertime !hw-ref !talos | xperf"
          - "'test-windows10-64-2009-qr"

  win11-hw:
    description: "Windows 11 hardware testing"
    query: "-xq 'test-windows11-64'"
    flags:
      - "--all-tasks"
      - "--no-artifact"
    worker_overrides:
      - win11-64-24h2-hw=releng-hardware/win11-64-24h2-hw-alpha
      - win11-64-24h2-hw-ref=releng-hardware/win11-64-24h2-hw-ref-alpha
      - b-win2022=gecko-1/b-win2022-alpha
    use_os_integration: true

  win10-2009:
    description: "Windows 10 version 2009"
    query: "-xq 'windows10-64'"
    flags:
      - "--all-tasks"
      - "--no-artifact"
    worker_overrides:
      - win10-64-2009=gecko-t/win10-64-2009-alpha
      - win10-64-2009-gpu=gecko-t/win10-64-2009-gpu-alpha
    use_os_integration: true

  win11-amd:
    description: "Windows 11 AMD testing"
    query: "-xq 'test-windows11-64'"
    flags:
      - "--all-tasks"
      - "--no-artifact"
    worker_overrides:
      - win11-64-24h2=gecko-t/win11-64-24h2-amd
    use_os_integration: true

  win11-source:
    description: "Source image testing"
    worker_type: "win11-64-24h2-source"
    query: ""
    flags:
      - "--full"
      - "--no-artifact"
    worker_overrides:
      - win11-64-24h2-source=gecko-t/win11-64-24h2-source-alpha
    use_os_integration: false

  b-win2022:
    description: "Build worker testing"
    worker_type: "b-win2022"
    query: ""
    flags:
      - "--all-tasks"
      - "--no-artifact"
    worker_overrides:
      - b-win2022=gecko-1/b-win2022-alpha
    use_os_integration: false

  b-win2025:
    description: "Server 2025 Desktop alpha: full Server 2022 builder task coverage"
    worker_type: "b-win2022"
    discovery_branch: autoland
    full_task_graph: true
    use_existing_tasks: false
    flags: ["--all-tasks", "--full", "--no-artifact"]
    worker_overrides:
      - b-win2022=gecko-1/b-win2025-alpha
    use_os_integration: false

  b-win2025-core:
    description: "Server 2025 Core alpha: full Server 2022 builder task coverage"
    worker_type: "b-win2022"
    discovery_branch: autoland
    full_task_graph: true
    use_existing_tasks: false
    flags: ["--all-tasks", "--full", "--no-artifact"]
    worker_overrides:
      - b-win2022=gecko-1/b-win2025-core-alpha
    use_os_integration: false

  b-win2025-gpu:
    description: "Server 2025 GPU alpha: full Server 2022 builder task coverage"
    worker_type: "b-win2022"
    discovery_branch: autoland
    full_task_graph: true
    use_existing_tasks: false
    flags: ["--all-tasks", "--full", "--no-artifact"]
    worker_overrides:
      - b-win2022=gecko-1/b-win2025-gpu-alpha
    use_os_integration: false

  win11-arm64:
    description: "ARM64 architecture testing"
    worker_type: "win11-a64-24h2"
    query: ""
    flags:
      - "--all-tasks"
      - "--no-artifact"
    worker_overrides:
      - win11-a64-24h2=gecko-t/win11-a64-24h2-alpha
    use_os_integration: false

  win11-a64-25h2-builder:
    description: "ARM64 25H2 builder image validation via generate-profile (PGO) — exercises the build toolchain on the win11-a64-25h2-builder image"
    query: "-q 'generate-profile-win64-aarch64-shippable'"
    flags:
      - "--no-artifact"
      - "--full"
    worker_overrides:
      - b-win-aarch64-25h2=gecko-1/win11-a64-25h2-builder-alpha
    use_os_integration: false

# Preset configuration documentation
# ===================================
#
# Each preset defines a standardized testing configuration with the following fields:
#
# - description: Human-readable description of the preset's purpose
# - worker_type: (Optional) Worker type for auto-discovery of tasks via --discover flag
# - query: Task selection query (empty string if no filtering required)
# - flags: List of command-line flags to pass to mach try
# - worker_overrides: List of worker pool mappings in format "old-worker=pool/new-worker"
# - use_os_integration: Boolean indicating if OS-specific integration features should be enabled
# - discovery_branch: Default branch for worker-type discovery
# - full_task_graph: Include unscheduled tasks and use exact label queries
# - use_existing_tasks: Default build reuse; false runs fresh builder tasks
# - query_sets: (Optional) Named sets of queries for different validation scenarios
#     Each query set has: description, queries, and optional use_existing_tasks,
#     skip_os_integration, watch_filter
#
# Usage:
#   mach try --preset=win11-24h2
#   mach try --preset=win11-hw
#   mach try --preset=win10-2009
#
# Preset Categories:
#
# OS Versions (use_os_integration: true):
#   - win11-24h2: Latest Windows 11 with 24H2 updates
#   - win10-2009: Windows 10 maintenance channel (version 2009)
#
# Hardware-Specific (use_os_integration: true):
#   - win11-hw: Real hardware testing infrastructure
#   - win11-amd: AMD-specific processor optimization testing
#
# Architecture-Specific (use_os_integration: false):
#   - win11-arm64: ARM64 native testing
#
# Worker-Specific (use_os_integration: false):
#   - b-win2022: Build system and source image validation
#   - win11-source: Source distribution and compilation testing
